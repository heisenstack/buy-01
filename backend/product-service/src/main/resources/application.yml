server:
  port: 8082
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: product-service
  mongodb:
    uri: ${MONGO_URI_PRODUCTS}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always