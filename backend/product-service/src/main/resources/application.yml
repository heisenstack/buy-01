server:
  port: 8082

spring:
  application:
    name: product-service
  mongodb:
    uri: mongodb://admin:adminpass@localhost:27017/buy01_products?authSource=admin
  data:
    mongodb:
      spring.mongodb.database: buy01_products

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  error:
    include-stacktrace: never
    include-message: never