server:
  port: 8083

  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: media-service
  mongodb:
      uri: ${MONGO_URI_MEDIA}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI}
  instance:
    prefer-ip-address: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always