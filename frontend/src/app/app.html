<div class="app-shell">
  <nav>
    <a routerLink="/" class="wordmark">Buy<span>01</span></a>
    <div class="nav-links">
      <a routerLink="/">
        <mat-icon aria-hidden="true">storefront</mat-icon>
        Shop
      </a>
      @if (authService.isSeller()) {
        <a routerLink="/dashboard">
          <mat-icon aria-hidden="true">dashboard</mat-icon>
          Dashboard
        </a>
      }
      @if (authService.isAuthenticated()) {
        <a routerLink="/profile">
          <mat-icon aria-hidden="true">person</mat-icon>
          Profile
        </a>
      }
      @if (!authService.isAuthenticated()) {
        <a routerLink="/login">
          <mat-icon aria-hidden="true">login</mat-icon>
          Login
        </a>
      }
      @if (authService.isAuthenticated()) {
        <button type="button" class="secondary icon-button" (click)="authService.logout()">
          <mat-icon aria-hidden="true">logout</mat-icon>
          Logout
        </button>
      }
    </div>
  </nav>

  <div class="container">
    <router-outlet></router-outlet>
  </div>
</div>
