<div class="panel">
  <div class="auth-header">
    <p class="eyebrow">Account access</p>
    <h2>{{ mode() === 'login' ? 'Welcome back' : 'Create your account' }}</h2>
    <p>
      {{
        mode() === 'login'
          ? 'Sign in to continue managing your listings and orders.'
          : 'Join the marketplace and start selling or shopping with confidence.'
      }}
    </p>
  </div>

  @if (mode() === 'login') {
    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="form-row" [class.has-error]="fieldErrors()['email'] || (loginForm.controls.email.invalid && loginForm.controls.email.touched)">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="name@email.com"
          [class.invalid]="fieldErrors()['email'] || (loginForm.controls.email.invalid && loginForm.controls.email.touched)"
          (input)="clearFieldError('email')"
          required
        />
      </div>

      <div class="form-row" [class.has-error]="fieldErrors()['password'] || (loginForm.controls.password.invalid && loginForm.controls.password.touched)">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.invalid]="fieldErrors()['password'] || (loginForm.controls.password.invalid && loginForm.controls.password.touched)"
          (input)="clearFieldError('password')"
          required
        />
      </div>

      <div class="auth-actions">
        <button type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
        </button>

        <button
          type="button"
          class="secondary auth-switch"
          (click)="toggleMode()"
          [disabled]="isSubmitting()"
        >
          Need an account? Register
        </button>
      </div>
    </form>
  } @else {
    <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="submit()">
      <div class="form-row" [class.has-error]="fieldErrors()['username'] || (registerForm.controls.username.invalid && registerForm.controls.username.touched)">
        <label>Username</label>
        <input
          type="text"
          formControlName="username"
          placeholder="Enter your username"
          [class.invalid]="fieldErrors()['username'] || (registerForm.controls.username.invalid && registerForm.controls.username.touched)"
          (input)="clearFieldError('username')"
          required
        />
      </div>

      <div class="form-row" [class.has-error]="fieldErrors()['email'] || (registerForm.controls.email.invalid && registerForm.controls.email.touched)">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="name@email.com"
          [class.invalid]="fieldErrors()['email'] || (registerForm.controls.email.invalid && registerForm.controls.email.touched)"
          (input)="clearFieldError('email')"
          required
        />
      </div>

      <div class="form-row" [class.has-error]="fieldErrors()['password'] || (registerForm.controls.password.invalid && registerForm.controls.password.touched)">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="••••••••"
          [class.invalid]="fieldErrors()['password'] || (registerForm.controls.password.invalid && registerForm.controls.password.touched)"
          (input)="clearFieldError('password')"
          required
        />
      </div>

      <div class="form-row" [class.has-error]="fieldErrors()['role'] || (registerForm.controls.role.invalid && registerForm.controls.role.touched)">
        <label>I am a</label>
        <select
          formControlName="role"
          [class.invalid]="fieldErrors()['role'] || (registerForm.controls.role.invalid && registerForm.controls.role.touched)"
          (change)="clearFieldError('role')"
        >
          <option value="CLIENT">Client</option>
          <option value="SELLER">Seller</option>
        </select>
      </div>

      <div class="auth-actions">
        <button type="submit" [disabled]="isSubmitting()">
          {{ isSubmitting() ? 'Creating account...' : 'Create account' }}
        </button>

        <button
          type="button"
          class="secondary auth-switch"
          (click)="toggleMode()"
          [disabled]="isSubmitting()"
        >
          Already have an account? Login
        </button>
      </div>
    </form>
  }
</div>
