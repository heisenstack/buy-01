<div class="create-product-shell" [class.modal-shell]="mode === 'modal'">
  <div class="create-product-header">
    <div>
      <p class="eyebrow">Create product</p>
      <h2>List a New Product</h2>
    </div>

    @if (mode === 'modal') {
      <button
        type="button"
        class="close-button"
        aria-label="Close product form"
        (click)="closeForm()"
      >
        ×
      </button>
    }
  </div>

  <form class="create-product-form" [formGroup]="productForm" (ngSubmit)="submit()">
    <div class="field-group" [class.has-error]="fieldErrors()['name'] || (productForm.controls.name.invalid && productForm.controls.name.touched)">
      <label>Name</label>
      <input
        type="text"
        formControlName="name"
        placeholder="e.g. Handmade Ceramic Mug"
        [class.invalid]="fieldErrors()['name'] || (productForm.controls.name.invalid && productForm.controls.name.touched)"
        (input)="clearFieldError('name')"
        required
      />
    </div>

    <div class="field-group" [class.has-error]="fieldErrors()['description'] || (productForm.controls.description.invalid && productForm.controls.description.touched)">
      <label>Description</label>
      <textarea
        formControlName="description"
        placeholder="Describe the piece..."
        [class.invalid]="fieldErrors()['description'] || (productForm.controls.description.invalid && productForm.controls.description.touched)"
        (input)="clearFieldError('description')"
        required
      ></textarea>
    </div>

    <div class="two-column-fields">
      <div class="field-group" [class.has-error]="fieldErrors()['price'] || (productForm.controls.price.invalid && productForm.controls.price.touched)">
        <label>Price (€)</label>
        <input
          type="number"
          formControlName="price"
          placeholder="0.00"
          [class.invalid]="fieldErrors()['price'] || (productForm.controls.price.invalid && productForm.controls.price.touched)"
          (input)="clearFieldError('price')"
          required
          min="0.01"
          step="0.01"
        />
      </div>

      <div class="field-group" [class.has-error]="fieldErrors()['quantity'] || (productForm.controls.quantity.invalid && productForm.controls.quantity.touched)">
        <label>Quantity</label>
        <input
          type="number"
          formControlName="quantity"
          placeholder="1"
          [class.invalid]="fieldErrors()['quantity'] || (productForm.controls.quantity.invalid && productForm.controls.quantity.touched)"
          (input)="clearFieldError('quantity')"
          required
          min="1"
          step="1"
        />
      </div>
    </div>

    <div class="field-group">
      <label>Photos (max 2 MB each, image/*)</label>
      <label class="upload-box" for="product-image-upload">
        <span class="upload-text">{{
          selectedImages().length ? 'Add more images' : 'Choose images'
        }}</span>
        <span class="upload-button">Browse</span>
      </label>
      <input
        id="product-image-upload"
        type="file"
        accept="image/*"
        multiple
        (change)="onFilesSelected($event)"
      />
      @if (selectedImages().length > 0) {
        <div class="image-preview-grid">
          @for (image of selectedImages(); track image.previewUrl; let index = $index) {
            <div class="image-preview">
              <img [src]="image.previewUrl" [alt]="image.file.name" />
              <button
                type="button"
                class="remove-image"
                [attr.aria-label]="'Remove ' + image.file.name"
                (click)="removeImage(index)"
              >
                <mat-icon aria-hidden="true">close</mat-icon>
              </button>
              <span>{{ image.file.name }}</span>
            </div>
          }
        </div>
      }
    </div>

    <div class="form-actions">
      <button type="submit" class="primary-btn" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Creating...' : 'Create Product' }}
      </button>

      @if (mode === 'modal') {
        <button type="button" class="secondary-btn" (click)="closeForm()">Cancel</button>
      }
    </div>
  </form>
</div>
