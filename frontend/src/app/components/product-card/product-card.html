<article class="product-card" [routerLink]="['/products', product.id]" role="link" tabindex="0">
  <div class="product-card-top">
    <span class="pill">{{ getQuantityLabel() }}</span>
  </div>

  @if (product.imageUrls && product.imageUrls.length > 0) {
    <div class="product-image-wrap">
      <img [src]="'https://localhost:8443' + product.imageUrls[0]" [alt]="product.name">
    </div>
  } @else {
    <div class="product-image-placeholder">
      <mat-icon aria-hidden="true">image</mat-icon>
    </div>
  }

  <div class="product-body">
    <div class="product-topline">
      <h3>{{ product.name }}</h3>
      <span class="price-tag">€{{ product.price | number: '1.2-2' }}</span>
    </div>

    <p class="description">{{ product.description || 'No description provided yet.' }}</p>

    <div class="meta-row">
      <span class="meta-user">
        <mat-icon aria-hidden="true">person</mat-icon>
        {{ getSellerName() }}
      </span>
      <span class="timestamp">{{ getTimestamp() }}</span>
    </div>

  </div>
</article>
